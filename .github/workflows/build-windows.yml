name: Build Windows x64

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore application icon
        shell: pwsh
        run: |
          $icon = [Convert]::FromBase64String((Get-Content src/app.ico.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD 'src/app.ico'), $icon)

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build x64 Release
        run: cmake --build build --config Release --parallel

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build/Release/AutoSync Clean v81.exe" package/
          Copy-Item README_VI.md package/
          if (Test-Path CHANGELOG_v81.md) { Copy-Item CHANGELOG_v81.md package/ }
          Compress-Archive -Path package/* -DestinationPath AutoSync_Clean_v81_Windows_x64.zip

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-Clean-v81-Windows-x64
          path: AutoSync_Clean_v81_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
