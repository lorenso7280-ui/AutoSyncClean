name: Build Virtual Input Lab

on:
  workflow_dispatch:
  push:
    paths:
      - "VirtualInputLab/**"
      - ".github/workflows/build-virtual-input-lab.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S VirtualInputLab -B VirtualInputLab/build -A x64

      - name: Build
        run: cmake --build VirtualInputLab/build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force VirtualInputLab/package | Out-Null
          Copy-Item "VirtualInputLab/build/Release/VirtualInputTarget.exe" VirtualInputLab/package/
          Copy-Item "VirtualInputLab/build/Release/VirtualInputController.exe" VirtualInputLab/package/
          Copy-Item "VirtualInputLab/README_VI.md" VirtualInputLab/package/
          Compress-Archive -Path VirtualInputLab/package/* -DestinationPath VirtualInputLab/VirtualInputLab_Windows_x64.zip -Force

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualInputLab_Windows_x64
          path: VirtualInputLab/VirtualInputLab_Windows_x64.zip
